<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>
</head>
<body>

    <h1>Add Employee</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Employee
        </button>

    </form>

    <br>

    <a href="{% url 'employee_list' %}">
        Back to Employees
    </a>

</body>
</html>

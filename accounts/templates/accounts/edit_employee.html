<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
</head>
<body>

    <h1>Edit Employee</h1>

    <p>
        Editing:
        <strong>{{ employee.username }}</strong>
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Update Employee
        </button>

    </form>

    <br>

    <a href="{% url 'employee_list' %}">
        Back to Employees
    </a>

</body>
</html>

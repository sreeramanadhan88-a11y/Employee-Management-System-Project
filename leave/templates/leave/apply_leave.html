<!DOCTYPE html>
<html>
<head>
    <title>Apply Leave</title>
</head>
<body>

    <h1>Employee Management System</h1>

    <h2>Apply for Leave</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Leave Request
        </button>

    </form>

    <br>

    <a href="{% url 'my_leaves' %}">
        View My Leave Requests
    </a>

    <br><br>

    <a href="{% url 'staff_dashboard' %}">
        Back to Dashboard
    </a>

</body>
</html>
